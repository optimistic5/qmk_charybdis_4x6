name: Build QMK firmware

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    steps:
      - name: Disable git safe directory checks
        run: git config --global --add safe.directory '*'

      # BastardKB maintains the Charybdis/Splinky board definitions (correct
      # RP2040 pins + trackball) in their own fork. Mainline QMK dropped them.
      - name: Checkout BastardKB QMK fork
        uses: actions/checkout@v4
        with:
          repository: Bastardkb/bastardkb-qmk
          ref: bkb-master
          submodules: recursive
          path: qmk_firmware

      - name: Checkout userspace
        uses: actions/checkout@v4
        with:
          path: userspace

      - name: Build firmware
        run: |
          qmk config user.qmk_home="$GITHUB_WORKSPACE/qmk_firmware"
          qmk config user.overlay_dir="$GITHUB_WORKSPACE/userspace"
          qmk compile -kb bastardkb/charybdis/4x6 -km optimistic5
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find "$GITHUB_WORKSPACE" -maxdepth 4 -name '*.uf2' -exec cp -v {} "$GITHUB_WORKSPACE/artifacts/" \;

      - name: Archive firmware
        uses: actions/upload-artifact@v4
        with:
          name: charybdis_4x6_splinky
          retention-days: 30
          path: artifacts/*.uf2
